<!doctype html>
<html lang="ru" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fullbody — дневник тренировок</title>
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#121417',panel:'#1a1d22',raise:'#222630',line:'#2c313a',accent:'#6fa8dc',good:'#7cc4a0',mute:'#8b93a1'}}}}</script>
<style>
:root{color-scheme:dark}
html,body{background:#121417;color:#e6e9ee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
/* body-префикс нужен, чтобы перебить preflight Tailwind (input{padding:0}), который грузится позже */
body input:not([type=checkbox]),body select{background:#222630;border:1px solid #2c313a;border-radius:.6rem;color:inherit;min-height:48px;padding:.625rem .875rem;width:100%;text-align:center}
body select{text-align-last:center}
body input::placeholder{color:#8b93a1;opacity:1}
input:focus,select:focus,button:focus-visible,.rep:focus-visible,.numcell:focus-visible{outline:2px solid #6fa8dc;outline-offset:1px}
/* Поле повторений: не input, клавиатура не нужна */
.rep{position:relative;overflow:hidden;width:min(100%,84px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#222630;border:1.5px dashed #3a4150;
 touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:border-color .2s,background .2s}
.rep::before,.rep::after{position:absolute;top:50%;transform:translateY(-50%);font-size:1.25rem;line-height:1;color:#8b93a1;opacity:.35;z-index:1}
.rep::before{content:'‹';left:8px}.rep::after{content:'›';right:8px}
.rep-val{position:relative;z-index:1;font-size:1.9rem;font-weight:600;color:#8b93a1;transition:color .2s}
.rep-fill{position:absolute;inset:0;background:linear-gradient(0deg,rgba(111,168,220,.6),rgba(111,168,220,.2));transform:scaleY(0);transform-origin:bottom;transition:transform .25s ease-out}
.rep.holding{border-color:#6fa8dc}
.rep.holding .rep-fill{transform:scaleY(1);transition:transform var(--hold,670ms) linear}
.rep.holding .rep-val{color:#e6e9ee}
.rep.done{border-style:solid;border-color:#6fa8dc;background:rgba(111,168,220,.12)}
.rep.done .rep-val{color:#e6e9ee}
.rep.drag{cursor:grabbing;box-shadow:0 0 0 3px rgba(111,168,220,.25)}
.rep.pop{animation:pop .45s ease-out}
.tick{animation:tick .18s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07);box-shadow:0 0 0 7px rgba(124,196,160,.35)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(124,196,160,0)}}
@keyframes tick{0%{transform:scale(1.28)}100%{transform:scale(1)}}
.failtxt{display:flex;align-items:center;justify-content:center;min-height:2.3em;margin-top:.5rem;max-width:100%;font-size:.6875rem;line-height:1.15;text-align:center;color:#8b93a1;transition:color .2s}
.failtxt.on{color:#e6e9ee}
.rep.fail .rep-val{color:#e5726e}
.rep.fail:not(.done) .rep-val{opacity:.6}
@media (prefers-reduced-motion:reduce){.rep.holding .rep-fill{transform:scaleY(.4)}}
.num{font-variant-numeric:tabular-nums}
#top{display:none}
.app-mode #top{display:flex}
.app-mode main{padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem)}
html,body{height:100%;overflow:hidden}
#app{text-align:center;overscroll-behavior:contain}
/* поле-граница в плане: тянуть вправо/влево */
.numcell{position:relative;width:76px;height:52px;display:grid;place-items:center;border-radius:.9rem;background:#222630;border:1px solid #2c313a;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:border-color .2s,box-shadow .2s}
.numcell::before,.numcell::after{content:'‹';position:absolute;top:50%;transform:translateY(-50%);font-size:1.1rem;line-height:1;color:#8b93a1;opacity:.35}
.numcell::before{left:8px}.numcell::after{content:'›';right:8px}
.nv{display:block;font-size:1.4rem;font-weight:600}
.numcell.drag{border-color:#6fa8dc;box-shadow:0 0 0 3px rgba(111,168,220,.25)}
.numcell.mini{width:56px;height:44px;border-radius:.7rem}
.numcell.mini .nv{font-size:1.05rem}
.numcell.mini::before,.numcell.mini::after{font-size:.8rem}
.numcell.mini::before{left:4px}.numcell.mini::after{right:4px}
.numcell.pl{width:76px;height:46px;border-radius:.8rem}.numcell.pl .nv{font-size:1.25rem}
textarea.p-name,textarea.p-mus{display:block;width:100%;background:transparent;border:0;padding:0;margin:0;resize:none;overflow:hidden;text-align:center;color:#e6e9ee;font-family:inherit;border-radius:.4rem}
textarea.p-name{font-size:1.25rem;line-height:1.4;font-weight:600}
textarea.p-mus{margin-top:.5rem;font-size:.9375rem;line-height:1.35;color:#8fa1bd}
textarea.p-name::placeholder,textarea.p-mus::placeholder{color:#8b93a1;opacity:.7}
textarea.p-name:focus,textarea.p-mus:focus{outline:2px solid #6fa8dc;outline-offset:3px}
.media{position:relative;width:min(50%,16rem);min-width:11rem;aspect-ratio:272/260;margin:1.25rem auto 0;border-radius:.75rem;border:1px solid #2c313a;background:#14171b;overflow:hidden;display:grid;place-items:center;cursor:pointer}
.media .mv{height:70%;width:auto;margin-top:-6%}
.media video{width:100%;height:100%;object-fit:cover;display:block}
.media .media-cap{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:.6875rem;color:#8b93a1}
.del{color:#8fa1bd}
.rep.lock .rep-val{opacity:.45}
#app>*{max-width:36rem;margin-inline:auto}
[data-act="rest"]{-webkit-touch-callout:none;-webkit-user-select:none;touch-action:manipulation}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="top" class="fixed z-30 top-0 left-0 right-0 md:left-44 items-center justify-between pl-5 pr-2 bg-ink border-b border-line" style="height:calc(48px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)"><span class="font-semibold">Fullbody <span data-ver class="text-xs font-normal text-mute align-middle"></span></span><button data-act="quit" aria-label="Закрыть приложение" class="w-12 h-12 grid place-items-center text-2xl text-mute">✕</button></header>
<nav id="nav" class="fixed z-30 bottom-0 inset-x-0 h-16 flex bg-panel border-t border-line md:inset-y-0 md:right-auto md:w-44 md:h-auto md:flex-col md:border-t-0 md:border-r md:pt-6" style="padding-bottom:env(safe-area-inset-bottom)"></nav>
<div id="stage" class="fixed inset-x-0 top-0 bottom-16 md:left-44 md:bottom-0 flex flex-col">
<main id="app" class="flex-1 min-h-0 overflow-y-auto px-4 pt-6 pb-6"></main>
<div id="timer" class="shrink-0 hidden bg-panel border-t border-line"></div>
</div>
<script src="app.js"></script>
</body>
</html>
